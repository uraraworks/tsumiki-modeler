<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>つみきモデラー</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./src/style.css">
  <script type="importmap">
    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}
  </script>
  <script type="module" src="./src/main.js"></script>
</head>
<body>
  <header><div><span class="logo">▦</span><h1>つみきモデラー</h1><span class="badge">プロトタイプ 01</span></div><span class="subtitle">つみきでつくる、ちいさな世界。</span></header>
  <main>
    <section class="workspace" aria-label="モデリング画面">
      <div class="view-heading"><span>3D ビュー</span><span id="resolution">384 × 216</span></div>
      <div id="viewport"><div id="canvas-host"></div></div>
      <div class="view-help">ドラッグ：回転　／　ホイール：ズーム　／　右ドラッグ：移動</div>
      <nav class="toolbar" aria-label="編集ツール">
        <button id="add-box" class="primary">＋ 箱を追加</button><button id="add-cylinder">＋ 円柱を追加</button><button id="delete">削除</button>
        <span class="divider"></span><button id="undo">元に戻す</button><button id="redo">やり直す</button>
        <span class="divider"></span><button id="save">JSON保存</button><button id="load">JSON読込</button>
      </nav>
      <p id="status" role="status" aria-live="polite">パーツを選んで、つくりはじめましょう。</p>
    </section>
    <aside>
      <section class="parts-section"><h2>パーツ <span id="part-count"></span></h2><ul id="part-list" aria-label="パーツ一覧"></ul></section>
      <section class="properties"><h2>プロパティ <span id="part-type"></span></h2><p id="empty-selection">パーツを選択してください。</p>
        <form id="properties-form" hidden>
          <label>名前<input id="part-name" type="text" maxlength="100" required></label>
          <fieldset><legend>位置</legend><div class="triple"><label>X<input type="number" step="1" required data-vector="position" data-axis="0"></label><label>Y<input type="number" step="1" required data-vector="position" data-axis="1"></label><label>Z<input type="number" step="1" required data-vector="position" data-axis="2"></label></div></fieldset>
          <fieldset id="box-fields"><legend>サイズ</legend><div class="triple"><label>X<input type="number" step="1" min="1" required data-vector="size" data-axis="0"></label><label>Y<input type="number" step="1" min="1" required data-vector="size" data-axis="1"></label><label>Z<input type="number" step="1" min="1" required data-vector="size" data-axis="2"></label></div></fieldset>
          <fieldset id="cylinder-fields"><legend>円柱</legend><div class="triple"><label>半径<input type="number" step="1" min="1" required data-scalar="radius"></label><label>高さ<input type="number" step="1" min="1" required data-scalar="height"></label><label>分割数<input type="number" step="1" min="3" max="64" required data-scalar="segments"></label></div></fieldset>
          <fieldset><legend>回転（度）</legend><div class="triple"><label>X<input type="number" step="1" required data-vector="rotation" data-axis="0"></label><label>Y<input type="number" step="1" required data-vector="rotation" data-axis="1"></label><label>Z<input type="number" step="1" required data-vector="rotation" data-axis="2"></label></div></fieldset>
          <label>色<div class="color-row"><input id="part-color" type="color"><output id="color-value"></output></div></label><div id="palette" aria-label="カラーパレット"></div>
        </form>
      </section>
    </aside>
  </main>
  <footer><span>ひとつずつ、かたちに。</span><span>整数グリッド · ローカル編集</span></footer>
  <input id="file-input" type="file" accept=".json,application/json" hidden>
</body>
</html>
